name: controls
on: [push, pull_request]
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byte-compile bench package
        run: python -m compileall -q bench
      - name: Grader controls (36 positive/negative cases)
        run: python -m bench.controls
